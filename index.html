function createGlobeStars(container,count,layer){
    if(!container)return;
    container.innerHTML='';
    for(let i=0;i<count;i++){
        const star=document.createElement('div');
        star.className='globe-star';
        const size=layer===1?Math.random()*1.5+0.5:layer===2?Math.random()*2+1:Math.random()*3+1.5;
        star.style.width=size+'px';
        star.style.height=size+'px';
        star.style.left=Math.random()*100+'%';
        star.style.top=Math.random()*100+'%';
        star.style.animationDelay=(Math.random()*3)+'s';
        star.style.animationDuration=(Math.random()*2+2)+'s';
        container.appendChild(star);
    }
}

function startMeteors(){
    if(meteorInterval)clearInterval(meteorInterval);
    meteorInterval=setInterval(()=>{
        if(Math.random()>0.6)createMeteor();
    },3000);
}

function createMeteor(){
    const layer=document.getElementById('meteorLayer');
    if(!layer)return;
    const meteor=document.createElement('div');
    meteor.className='meteor';
    meteor.style.left=Math.random()*40+'%';
    meteor.style.top=Math.random()*30+'%';
    meteor.style.animationDuration=(Math.random()*1+1)+'s';
    layer.appendChild(meteor);
    setTimeout(()=>meteor.remove(),2000);
}

function createRipple(e,container){
    const rect=container.getBoundingClientRect();
    const ripple=document.createElement('div');
    ripple.className='globe-ripple';
    ripple.style.left=(e.clientX-rect.left)+'px';
    ripple.style.top=(e.clientY-rect.top)+'px';
    container.appendChild(ripple);
    setTimeout(()=>ripple.remove(),800);
}

function playGlobeSound(){
    const ctx=getAudioCtx();
    if(!ctx)return;
    try{
        const notes=[523,659,784];
        notes.forEach((freq,i)=>{
            const osc=ctx.createOscillator();
            const gain=ctx.createGain();
            osc.type='sine';
            osc.frequency.setValueAtTime(freq,ctx.currentTime+i*0.08);
            gain.gain.setValueAtTime(0,ctx.currentTime+i*0.08);
            gain.gain.linearRampToValueAtTime(0.08,ctx.currentTime+i*0.08+0.02);
            gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.08+0.4);
            osc.connect(gain);gain.connect(ctx.destination);
            osc.start(ctx.currentTime+i*0.08);osc.stop(ctx.currentTime+i*0.08+0.4);
        });
    }catch(e){}
}

function playRocketSound(){

    if(!ctx)return;
    try{
        [220,330,440,550,660].forEach((freq,i)=>{
            const osc=ctx.createOscillator();
            const gain=ctx.createGain();
            osc.type='sawtooth';
            osc.frequency.setValueAtTime(freq,ctx.currentTime+i*0.1);

            osc.start(ctx.currentTime+i*0.1);
            osc.stop(ctx.currentTime+i*0.1+0.25);
        });
    }catch(e){}
}

function createFireworks(x,y){
    const layer=document.getElementById('fireworksLayer');
    if(!layer)return;
    const colors=['#fbbf24','#ef4444','#22c55e','#38bdf8','#a78bfa','#f472b6','#22d3ee'];
    const particleCount=40;
    const ring=document.createElement('div');
    ring.className='firework-ring';
    ring.style.left=x+'px';
    ring.style.top=y+'px';
    ring.style.borderColor=colors[Math.floor(Math.random()*colors.length)];
    layer.appendChild(ring);
    setTimeout(()=>ring.remove(),1000);
    for(let i=0;i<particleCount;i++){
        const particle=document.createElement('div');
        particle.className='firework-particle';
        particle.style.left=x+'px';
        particle.style.top=y+'px';
        const color=colors[Math.floor(Math.random()*colors.length)];
        particle.style.background=color;
        particle.style.color=color;
        const angle=(i/particleCount)*Math.PI*2+Math.random()*0.3;
        const distance=100+Math.random()*150;
        particle.style.setProperty('--x',Math.cos(angle)*distance+'px');
        particle.style.setProperty('--y',Math.sin(angle)*distance+'px');
        const size=3+Math.random()*4;
        particle.style.width=size+'px';
        particle.style.height=size+'px';
        layer.appendChild(particle);
        setTimeout(()=>particle.remove(),2000);
    }
    playFireworkSound();
}

function playFireworkSound(){
    const ctx=getAudioCtx();
    if(!ctx)return;
    try{
        const bufferSize=ctx.sampleRate*0.3;
        const buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);
        const data=buffer.getChannelData(0);
        for(let i=0;i<bufferSize;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/bufferSize,3);
        const noise=ctx.createBufferSource();
        noise.buffer=buffer;
        const filter=ctx.createBiquadFilter();
        filter.type='highpass';
        filter.frequency.setValueAtTime(1000,ctx.currentTime);
        const gain=ctx.createGain();
        gain.gain.setValueAtTime(0.15,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
        noise.connect(filter);filter.connect(gain);gain.connect(ctx.destination);
        noise.start(ctx.currentTime);noise.stop(ctx.currentTime+0.3);
    }catch(e){}
}

function renderPathwayScene(pid){
    const scene=document.getElementById('pathwayScene');
    const stage=document.getElementById('sceneStage');
    const title=document.getElementById('sceneTitle');
    const caption=document.getElementById('sceneCaption');
    if(!scene!stage!title||!caption)return;
    const data=PATHWAY_SCENES[pid];
    if(!data)return;
    scene.classList.remove('safe','warning','danger');
    scene.classList.add(data.type);
    title.textContent=data.title;
    stage.innerHTML=data.svg;
    caption.innerHTML=data.caption;
}

function showStory(pid){
    const s=STORIES[pid];
    if(!s)return;
    const overlay=document.getElementById('storyModeOverlay');
    const icon=document.getElementById('storyIcon');
    const title=document.getElementById('storyTitle');
    const text=document.getElementById('storyText');
    const progressBar=document.getElementById('storyProgressBar');
    if(!overlay)return;
    icon.textContent=s.icon;
    title.textContent=s.title;
    text.textContent='';
    progressBar.style.width='0%';
    storyProgress=0;
    overlay.classList.add('show');
    let i=0;
    const fullText=s.text;
    if(storyTimer)clearInterval(storyTimer);
    storyTimer=setInterval(()=>{
        if(i<fullText.length){
            text.textContent+=fullText[i];
            i++;
            storyProgress=(i/fullText.length)*100;
            progressBar.style.width=storyProgress+'%';
        }else{
            clearInterval(storyTimer);
            storyTimer=null;
        }
    },30);
}

function skipStory(){
    if(storyTimer){clearInterval(storyTimer);storyTimer=null;}
    const pid=document.getElementById('pathwaySelect').value;
    const s=STORIES[pid];
    if(s){
        document.getElementById('storyText').textContent=s.text;
        document.getElementById('storyProgressBar').style.width='100%';
    }
}

function closeStory(){
    const overlay=document.getElementById('storyModeOverlay');
    if(overlay)overlay.classList.remove('show');
    if(storyTimer){clearInterval(storyTimer);storyTimer=null;}
}

    document.getElementById('gameTrees').textContent=gameState.stats.trees;

    const avail=GAME_SCENARIOS.filter((_,i)=>!gameState.used.includes(i));
    if(!avail.length)gameState.used=[];
    const idx=GAME_SCENARIOS.indexOf(avail[Math.floor(Math.random()*avail.length)]);
    gameState.used.push(idx);
    gameState.currentScenario=GAME_SCENARIOS[idx];
    document.getElementById('gameScenarioTitle').textContent=gameState.currentScenario.title;
    document.getElementById('gameScenarioDesc').textContent=gameState.currentScenario.desc;
    const ch=document.getElementById('gameChoices');

        ch.appendChild(b);
    });
}

function calculateGrade(score,s){
    let gp=0;
    if(score>=90)gp+=5;else if(score>=75)gp+=4;else if(score>=60)gp+=3;else if(score>=40)gp+=2;else if(score>=20)gp+=1;
    if(s.trees>=80)gp+=2;else if(s.trees>=60)gp+=1;else if(s.trees<30)gp-=1;
    if(s.water>=80)gp+=2;else if(s.water>=60)gp+=1;else if(s.water<30)gp-=1;
    if(s.peace>=80)gp+=2;else if(s.peace>=60)gp+=1;else if(s.peace<30)gp-=1;
    if(s.edu>=80)gp+=2;else if(s.edu>=60)gp+=1;else if(s.edu<30)gp-=1;
    if(s.temp<=1.0)gp+=2;else if(s.temp<=1.5)gp+=1;else if(s.temp>=3)gp-=3;else if(s.temp>=2.5)gp-=2;
    if(gp>=14)return{letter:'S',label:'أسطوري',cls:'plus'};
    if(gp>=11)return{letter:'A',label:'ممتاز',cls:'a'};
    if(gp>=8)return{letter:'B',label:'جيد جداً',cls:'b'};
    if(gp>=5)return{letter:'C',label:'جيد',cls:'c'};
    if(gp>=2)return{letter:'D',label:'ضعيف',cls:'d'};
    return{letter:'F',label:'فاشل',cls:'f'};
}

        },20);
    },2500);
    setTimeout(()=>{

}

function getWeekKey(){
    const d=new Date(),day=d.getDay();
    const diff=d.getDate()-day+(day===0?-6:1);
    return new Date(d.setDate(diff)).toISOString().split('T')[0];
}

    const wk=getWeekKey();
    if(localStorage.getItem('worldLabChallengesWeek')===wk&&challenges.length>0)return;
    const sh=[...CHALLENGES].sort(()=>Math.random()-0.5);
    challenges=sh.slice(0,4).map(t=>({...t,progress:0,completed:false}));
    localStorage.setItem('worldLabChallenges',JSON.stringify(challenges));
    localStorage.setItem('worldLabChallengesWeek',wk);
}

        let np=c.progress;

            case 'wins':if(s.win)np=Math.min(c.t,c.progress+1);break;
            case 'maxScore':np=Math.max(c.progress,s.score);break;

        }
        if(np!==c.progress){

window.addEventListener('load',async()=>{
    renderReferences();
    renderAchievements();
    runSimulation();
    renderWorldMap();
    renderGlobalStats();
    renderChallenges();
    renderLeaderboard();
    renderTrophy();
    if(playerName)document.getElementById('playerNameInput').value=playerName;
    initEyes();
    initInteractiveGlobe();
    createManifest();
    await registerSW();
    const isMobile=/Android|iPhone|iPad/i.test(navigator.userAgent);
    const shownInstall=localStorage.getItem('worldLabShownInstall');
    if(isMobile&&!shownInstall&&!window.matchMedia('(display-mode: standalone)').matches){
        setTimeout(()=>{
            localStorage.setItem('worldLabShownInstall','true');
            openInstallGuide();
        },3000);
    }
    console.log('🌍 World Lab v19.0 Loaded — Complete with 10 Pathways');
});

document.addEventListener('keydown',(e)=>{
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key==='Q'){e.preventDefault();showQRCode();}
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key==='A'){e.preventDefault();openAdminPanel();}
});

window.addEventListener('beforeunload',()=>{
    if(meteorInterval)clearInterval(meteorInterval);
    if(spaceMusic.interval)clearInterval(spaceMusic.interval);
    if(storyTimer)clearInterval(storyTimer);
});

document.addEventListener('click',(e)=>{
    if(!e.target.closest('.city-marker')&&!e.target.closest('.city-popup')){
        document.querySelectorAll('.city-popup').forEach(p=>p.remove());
    }
});

window.addEventListener('scroll',()=>{
    document.querySelectorAll('.city-popup').forEach(p=>p.remove());
},{passive:true});

window.addEventListener('online',()=>showNotification('🟢 متصل'));
window.addEventListener('offline',()=>showNotification('🔴 غير متصل'));
</script>
</body>
</html>
